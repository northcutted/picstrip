version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    groups:
      release-analysis:
        patterns:
          - "@semantic-release/*"
          - "conventional-*"
    schedule:
      interval: weekly
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
