name: Verified Metadata Update
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Immutable release tag; select that tag as the workflow ref
      metadata_commit:
        type: string
        required: true
        description: Exact reviewed metadata commit on main (40 characters)
      submit_for_review:
        type: boolean
        default: false
        description: Request production approval for review after updating metadata
permissions:
  contents: read
concurrency:
  group: metadata-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    uses: northcutted/ios-release-workflows/.github/workflows/deploy.yml@60ec43c4a00a8d942acaa07d469a26c0e89fc005
    with:
      config: .github/ios-release.json
      platform_revision: 60ec43c4a00a8d942acaa07d469a26c0e89fc005
      release_tag: ${{ inputs.release_tag }}
      metadata_commit: ${{ inputs.metadata_commit }}
      submit: ${{ inputs.submit_for_review }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
