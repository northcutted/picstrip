name: Verified Metadata Update
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Immutable release tag; select that tag as the workflow ref
      metadata_commit:
        type: string
        required: true
        description: Exact reviewed metadata commit on main (40 characters)
      submit_for_review:
        type: boolean
        default: false
        description: Request production approval for review after updating metadata
permissions:
  contents: read
concurrency:
  group: metadata-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    uses: northcutted/ios-release-workflows/.github/workflows/deploy.yml@c692b58b00564a5eb7c38a97b226f2132f7e926a
    with:
      config: .github/ios-release.json
      platform_revision: c692b58b00564a5eb7c38a97b226f2132f7e926a
      release_tag: ${{ inputs.release_tag }}
      metadata_commit: ${{ inputs.metadata_commit }}
      submit: ${{ inputs.submit_for_review }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
