name: App Store Metadata Only

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Existing App Store version to update. Leave blank to infer the current editable version."
        required: false
        default: ""
      build_number:
        description: "Existing TestFlight/App Review build number. Leave blank to infer the selected build."
        required: false
        default: ""
      submit_for_review:
        description: "Submit the amended version for review after updating metadata"
        required: true
        type: boolean
        default: false

concurrency:
  group: app-store-metadata-${{ inputs.marketing_version || 'inferred' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata-only:
    name: Update App Store Metadata Only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Validate metadata files
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          let ok = true;
          for (const locale of fs.readdirSync('fastlane/metadata')) {
            const dir = path.join('fastlane/metadata', locale);
            if (!fs.statSync(dir).isDirectory()) continue;
            for (const [file, limit] of [
              ['description.txt', 4000],
              ['promotional_text.txt', 170],
              ['subtitle.txt', 30],
              ['keywords.txt', 100],
            ]) {
              const filePath = path.join(dir, file);
              if (!fs.existsSync(filePath)) continue;
              const text = fs.readFileSync(filePath, 'utf8').trimEnd();
              const chars = [...text].length;
              if (chars > limit) {
                console.error(`${filePath}: ${chars}/${limit}`);
                ok = false;
              }
            }
          }
          if (!ok) process.exit(1);
          NODE

      - name: Push metadata only
        env:
          APP_STORE_CONNECT_API_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:    ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MARKETING_VERSION:                    ${{ inputs.marketing_version }}
          BUILD_NUMBER:                         ${{ inputs.build_number }}
          SUBMIT_FOR_REVIEW:                    ${{ inputs.submit_for_review }}
        run: bundle exec fastlane metadata_only
