# Actions are pinned; the SLSA generator version-tag exception is policy-checked.
---
name: Reusable QA
'on':
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      prefix:
        type: string
        required: true
      test_workers:
        type: string
        default: '1'
permissions:
  contents: read
jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ inputs.source }}"
    - name: Install verified SwiftLint
      run: bash scripts/ci/install_swiftlint.sh
    - name: Run strict lint
      run: python3 scripts/ci/run_qa.py lint swiftlint lint --strict --no-cache --config
        .swiftlint.yml
      env:
        SOURCE_SHA: "${{ inputs.source }}"
    - name: Upload qa-lint-${{ inputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-lint-${{ inputs.prefix }}
        path: qa-results/
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
      if: always()
  analyze:
    name: analyze
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ inputs.source }}"
    - name: Validate Xcode and resolve simulator
      run: python3 scripts/ci/toolchain.py
    - name: Set up Ruby
      uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
      with:
        bundler-cache: false
    - name: Install locked gems
      run: |-
        bundle config set --local path vendor/bundle
        bundle config set --local frozen true
        bundle install --jobs 4 --retry 3
    - name: Run analyze
      run: python3 scripts/ci/run_qa.py analyze bundle exec fastlane analyze
      env:
        SOURCE_SHA: "${{ inputs.source }}"
        TEST_WORKERS: "${{ inputs.test_workers }}"
    - name: Upload qa-analyze-${{ inputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-analyze-${{ inputs.prefix }}
        path: qa-results/
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
      if: always()
  test:
    name: test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ inputs.source }}"
    - name: Validate Xcode and resolve simulator
      run: python3 scripts/ci/toolchain.py
    - name: Set up Ruby
      uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
      with:
        bundler-cache: false
    - name: Install locked gems
      run: |-
        bundle config set --local path vendor/bundle
        bundle config set --local frozen true
        bundle install --jobs 4 --retry 3
    - name: Run test
      run: python3 scripts/ci/run_qa.py test bundle exec fastlane test
      env:
        SOURCE_SHA: "${{ inputs.source }}"
        TEST_WORKERS: "${{ inputs.test_workers }}"
    - name: Upload qa-test-${{ inputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-test-${{ inputs.prefix }}
        path: qa-results/
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
      if: always()
    - name: Upload xcresult-test-${{ inputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: xcresult-test-${{ inputs.prefix }}
        path: build/test_output/
        retention-days: 14
        compression-level: 0
        if-no-files-found: error
      if: always()
  test-ios26:
    name: test-ios26
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ inputs.source }}"
    - name: Validate Xcode and resolve simulator
      run: python3 scripts/ci/toolchain.py --compatibility
    - name: Set up Ruby
      uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
      with:
        bundler-cache: false
    - name: Install locked gems
      run: |-
        bundle config set --local path vendor/bundle
        bundle config set --local frozen true
        bundle install --jobs 4 --retry 3
    - name: Run test-ios26
      run: python3 scripts/ci/run_qa.py test-ios26 bundle exec fastlane test
      env:
        SOURCE_SHA: "${{ inputs.source }}"
        TEST_WORKERS: "${{ inputs.test_workers }}"
    - name: Upload qa-test-ios26-${{ inputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-test-ios26-${{ inputs.prefix }}
        path: qa-results/
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
      if: always()
    - name: Upload xcresult-test-ios26-${{ inputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: xcresult-test-ios26-${{ inputs.prefix }}
        path: build/test_output/
        retention-days: 14
        compression-level: 0
        if-no-files-found: error
      if: always()
  package:
    name: Validate QA evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - lint
    - analyze
    - test
    - test-ios26
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ inputs.source }}"
    - name: Download QA results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: qa-*-${{ inputs.prefix }}
        path: qa-results
        merge-multiple: true
    - name: Require all checks and executed tests
      run: |-
        mkdir -p build/qa
        python3 scripts/ci/evidence.py qa qa-results --output build/qa --source "$SOURCE_SHA"
        python3 scripts/ci/evidence.py checksums build/qa --output build/qa/qa-checksums.json
      env:
        SOURCE_SHA: "${{ inputs.source }}"
    - name: Upload qa-evidence-${{ inputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-evidence-${{ inputs.prefix }}
        path: build/qa/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
