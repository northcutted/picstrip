name: App Store Deploy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Immutable release tag; run this workflow on the same tag
      submit:
        type: boolean
        default: true
        description: Request production approval after staging
permissions:
  contents: read
concurrency:
  group: app-store-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    uses: northcutted/ios-release-workflows/.github/workflows/deploy.yml@60ec43c4a00a8d942acaa07d469a26c0e89fc005
    with:
      config: .github/ios-release.json
      platform_revision: 60ec43c4a00a8d942acaa07d469a26c0e89fc005
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag }}
      submit: ${{ github.event_name == 'release' || inputs.submit }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
