name: App Store Deploy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Immutable release tag; run this workflow on the same tag
      submit:
        type: boolean
        default: true
        description: Request production approval after staging
permissions:
  contents: read
concurrency:
  group: app-store-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    uses: northcutted/ios-release-workflows/.github/workflows/deploy.yml@c692b58b00564a5eb7c38a97b226f2132f7e926a
    with:
      config: .github/ios-release.json
      platform_revision: c692b58b00564a5eb7c38a97b226f2132f7e926a
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag }}
      submit: ${{ github.event_name == 'release' || inputs.submit }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
