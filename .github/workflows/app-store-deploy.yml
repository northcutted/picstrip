name: App Store Deploy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Immutable release tag; run this workflow on the same tag
      submit:
        type: boolean
        default: true
        description: Request production approval after staging
permissions:
  contents: read
concurrency:
  group: app-store-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    uses: northcutted/ios-release-workflows/.github/workflows/deploy.yml@a68defff01581aa5accf40ab97dceecd874f75fe
    with:
      config: .github/ios-release.json
      platform_revision: a68defff01581aa5accf40ab97dceecd874f75fe
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag }}
      submit: ${{ github.event_name == 'release' || inputs.submit }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
