name: App Store Deploy
on:
  create:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Immutable release tag; run on its release or protected deployment tag
      submit:
        type: boolean
        default: true
        description: Request production approval after staging
permissions:
  contents: read
concurrency:
  group: app-store-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && contains(github.ref_name, '-deploy-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout protected configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Load pinned deployment tools
        uses: northcutted/ios-release-workflows/actions/bootstrap@bc9e2d56b062c3292981f5df83270503b9522b65
        with:
          config: .github/ios-release.json
          revision: bc9e2d56b062c3292981f5df83270503b9522b65
      - name: Resolve immutable release from protected ref
        id: release
        run: python3 "$IOS_RELEASE_ROOT/scripts/ci/deployment_ref.py" verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  deploy:
    needs: resolve
    uses: northcutted/ios-release-workflows/.github/workflows/deploy.yml@bc9e2d56b062c3292981f5df83270503b9522b65
    with:
      config: .github/ios-release.json
      platform_revision: bc9e2d56b062c3292981f5df83270503b9522b65
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      submit: ${{ github.event_name != 'workflow_dispatch' || inputs.submit }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
