name: App Store Deploy (internal)
on:
  create:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Immutable release tag; run on its release or protected deployment tag
      submit:
        type: boolean
        default: true
        description: Request production approval after staging
      metadata_commit:
        type: string
        default: ""
        description: Recovery only; exact reviewed metadata commit
permissions:
  contents: read
concurrency:
  group: app-store-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && contains(github.ref_name, '-deploy-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      metadata_commit: ${{ steps.release.outputs.metadata_commit }}
      submit: ${{ steps.release.outputs.submit }}
    steps:
      - name: Checkout protected configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Load pinned deployment tools
        uses: northcutted/ios-release-workflows/actions/bootstrap@a3263909aaf9b71e9b4c5b92fbb5ef1728644b65
        with:
          config: .github/ios-release.json
          revision: a3263909aaf9b71e9b4c5b92fbb5ef1728644b65
      - name: Resolve immutable release from protected ref
        id: release
        run: ios-release deployment-ref verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          METADATA_COMMIT: ${{ inputs.metadata_commit }}
          REQUEST_SUBMISSION: ${{ github.event_name != 'workflow_dispatch' || inputs.submit }}
  deploy:
    needs: resolve
    uses: northcutted/ios-release-workflows/.github/workflows/deploy.yml@a3263909aaf9b71e9b4c5b92fbb5ef1728644b65
    with:
      config: .github/ios-release.json
      platform_revision: a3263909aaf9b71e9b4c5b92fbb5ef1728644b65
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      metadata_commit: ${{ needs.resolve.outputs.metadata_commit }}
      submit: ${{ needs.resolve.outputs.submit == 'true' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
