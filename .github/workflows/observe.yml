name: App Store Status
on:
  schedule:
    - cron: 17 * * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: app-store-observe
  cancel-in-progress: false
jobs:
  observe:
    uses: northcutted/ios-release-workflows/.github/workflows/observe.yml@3d02154e6f070560d08fdb993643ca5b5762153c
    with:
      config: .github/ios-release.json
      platform_revision: 3d02154e6f070560d08fdb993643ca5b5762153c
    permissions:
      contents: read
      actions: read
      attestations: read
    if: vars.RELEASE_DISTRIBUTION_ENABLED == 'true'
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
