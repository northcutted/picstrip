name: App Store Status
on:
  schedule:
    - cron: 17 * * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: app-store-observe
  cancel-in-progress: false
jobs:
  observe:
    uses: northcutted/ios-release-workflows/.github/workflows/observe.yml@60ec43c4a00a8d942acaa07d469a26c0e89fc005
    with:
      config: .github/ios-release.json
      platform_revision: 60ec43c4a00a8d942acaa07d469a26c0e89fc005
    permissions:
      contents: read
      actions: read
      attestations: read
    if: vars.RELEASE_DISTRIBUTION_ENABLED == 'true'
