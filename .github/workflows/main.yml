name: Release Prep
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-prep-main
  cancel-in-progress: false
jobs:
  prepare:
    uses: northcutted/ios-release-workflows/.github/workflows/prepare.yml@c692b58b00564a5eb7c38a97b226f2132f7e926a
    with:
      config: .github/ios-release.json
      platform_revision: c692b58b00564a5eb7c38a97b226f2132f7e926a
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
