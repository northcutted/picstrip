name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. Semantic Release dry run — determine next version ──────────────────
  version:
    name: Determine Next Version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # @semantic-release/github v10 checks write access in verifyConditions even on dry-run
    outputs:
      will_release: ${{ steps.semrel.outputs.will_release }}
      version:      ${{ steps.semrel.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install semantic-release
        run: npm ci

      - name: Dry-run semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "next release version"; then
            VERSION=$(echo "$OUTPUT" | grep -oP 'next release version is \K[^\s]+')
            echo "will_release=true"  >> "$GITHUB_OUTPUT"
            echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          else
            echo "will_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Validate the exact release SHA ───────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-26
    needs: version
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install SwiftLint
        run: |
          SWIFTLINT_VERSION="0.63.2"
          SWIFTLINT_SHA256="c59a405c85f95b92ced677a500804e081596a4cae4a6a485af76065557d6ed29"
          curl -sSL \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            -o /tmp/portable_swiftlint.zip
          echo "${SWIFTLINT_SHA256}  /tmp/portable_swiftlint.zip" | shasum -a 256 -c
          unzip -o /tmp/portable_swiftlint.zip -d /tmp/swiftlint_bin
          sudo mv /tmp/swiftlint_bin/swiftlint /usr/local/bin/swiftlint

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run SwiftLint
        run: bundle exec fastlane lint

  analyze:
    name: Static Analysis
    runs-on: macos-26
    needs: version
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('PicStrip.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Run xcodebuild analyze
        run: bundle exec fastlane analyze

  test:
    name: Unit Tests
    runs-on: macos-26
    needs: version
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('PicStrip.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Run Tests
        run: bundle exec fastlane test

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-test-results
          path: build/test_output/
          retention-days: 7

  # ── 3. Build + sign IPA, then attest the exact artifact ────────────────────
  build:
    name: Build & Attest IPA
    runs-on: macos-26
    needs: [version, lint, analyze, test]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      ipa-hashes: ${{ steps.digest.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Record the exact toolchain state so it is captured in the attestation
      # and SLSA provenance. Caches (DerivedData, SPM) are intentionally omitted
      # from this job: gym runs with clean:true but restoring shared cache state
      # from earlier runs would violate the SLSA L3 isolation requirement.
      - name: Record build environment
        run: |
          mkdir -p build
          {
            printf 'xcode_version: '
            xcodebuild -version | head -1 | awk '{print $2}'
            printf 'xcode_build: '
            xcodebuild -version | tail -1 | awk '{print $NF}'
            printf 'macos_version: '
            sw_vers -productVersion
            printf 'sdk_iphoneos: '
            xcodebuild -showsdks 2>/dev/null | grep 'iphoneos' | tail -1 | awk '{print $NF}'
          } > build/build-env.txt
          cat build/build-env.txt

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Match SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      # Capture the exact commit of the Match certificate repo so that the
      # signing inputs are recorded in the attestation alongside the IPA.
      - name: Record signing material state
        run: |
          MATCH_HEAD=$(git ls-remote git@github.com:northcutted/picstrip-certs.git HEAD \
            | cut -f1)
          {
            echo "match_repo: git@github.com:northcutted/picstrip-certs.git"
            echo "match_head: ${MATCH_HEAD}"
            echo "match_type: appstore"
          } > build/signing-env.txt
          cat build/signing-env.txt

      - name: Sync signing assets
        env:
          MATCH_PASSWORD:                       ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:    ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane certificates

      - name: Build IPA
        env:
          BUILD_NUMBER:                         ${{ github.run_number }}
          MARKETING_VERSION:                    ${{ needs.version.outputs.version }}
        run: bundle exec fastlane build

      - name: Compute SHA-256 of IPA and build environment
        id: digest
        run: |
          # Include the IPA plus both environment manifests so that the SLSA
          # provenance covers toolchain and signing inputs, not just the binary.
          HASHES=$(shasum -a 256 build/PicStrip.ipa build/build-env.txt build/signing-env.txt \
            | awk '{n=split($2,a,"/"); print $1 "  " a[n]}' \
            | base64 | tr -d '\n')
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          shasum -a 256 build/PicStrip.ipa | awk '{print $1 "  PicStrip.ipa"}' > build/PicStrip.ipa.sha256

      - name: Create GitHub artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            build/PicStrip.ipa
            build/build-env.txt
            build/signing-env.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PicStrip-${{ needs.version.outputs.version }}
          path: |
            build/PicStrip.ipa
            build/PicStrip.ipa.sha256
            build/build-env.txt
            build/signing-env.txt
          retention-days: 90

  # ── 3. Publish GitHub Release + tag ───────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version.outputs.version }}
      release_sha: ${{ steps.semrel.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install semantic-release
        run: npm ci

      - name: Publish release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          # Capture the post-release HEAD (includes the commit that
          # semantic-release made for CHANGELOG/project.pbxproj/release_notes.txt)
          # so downstream jobs can pin to this exact state instead of floating main.
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── 5. SLSA L3 Provenance ─────────────────────────────────────────────────
  provenance:
    name: SLSA Provenance
    needs: [version, build, release]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      actions:  read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.ipa-hashes }}"
      upload-assets: true
      upload-tag-name: "v${{ needs.version.outputs.version }}"

  # ── 6. Attach artifacts to GitHub Release ─────────────────────────────────
  attach-release-assets:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    needs: [version, build, release, provenance]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PicStrip-${{ needs.version.outputs.version }}
          path: artifacts/

      - name: Attach IPA + digest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" \
            artifacts/PicStrip.ipa \
            artifacts/PicStrip.ipa.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  # ── 7. Verify provenance before distribution ───────────────────────────────
  verify-provenance:
    name: Verify Provenance
    runs-on: ubuntu-latest
    needs: [version, build, release, provenance, attach-release-assets]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PicStrip-${{ needs.version.outputs.version }}
          path: verification/

      - name: Verify GitHub artifact attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify verification/PicStrip.ipa \
            --repo ${{ github.repository }} \
            --signer-workflow "github.com/${{ github.repository }}/.github/workflows/main.yml" \
            --source-ref "refs/heads/main" \
            --source-digest "${{ github.sha }}"

      - name: Download SLSA release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${{ needs.version.outputs.version }}" \
            --repo ${{ github.repository }} \
            --pattern "*.intoto.jsonl" \
            --dir verification

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify SLSA release provenance
        run: |
          PROVENANCE_PATH="$(find verification -name '*.intoto.jsonl' -type f | head -n 1)"
          test -n "$PROVENANCE_PATH"

          slsa-verifier verify-artifact verification/PicStrip.ipa \
            --provenance-path "$PROVENANCE_PATH" \
            --source-uri "github.com/${{ github.repository }}" \
            --source-branch main \
            --print-provenance > verification/verified-provenance.json

          jq -e \
            --arg sha "${{ github.sha }}" \
            --arg repo "${{ github.repository }}" \
            '.predicate.invocation.configSource.uri == ("git+https://github.com/" + $repo + "@refs/heads/main")
              and .predicate.invocation.configSource.digest.sha1 == $sha' \
            verification/verified-provenance.json > /dev/null

  # ── 8. Upload the verified IPA to TestFlight ───────────────────────────────
  upload-testflight:
    name: Upload Verified IPA to TestFlight
    runs-on: macos-26
    needs: [version, verify-provenance]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Download IPA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PicStrip-${{ needs.version.outputs.version }}
          path: artifacts/

      - name: Upload verified IPA to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:    ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          IPA_PATH:                             artifacts/PicStrip.ipa
        run: bundle exec fastlane upload_testflight

  # ── 9. Submit for App Review ───────────────────────────────────────────────
  # Requires manual approval via the "production" GitHub environment.
  # To enable: Settings → Environments → production → add required reviewers.
  #
  # Checks out main at HEAD (after semantic-release committed release_notes.txt
  # back) so the metadata directory includes the freshly generated What's New.
  # The binary is already in TestFlight; skip_binary_upload avoids a duplicate-
  # binary error and just submits the processed build for review.
  submit:
    name: Submit for App Review
    runs-on: ubuntu-latest
    environment: production
    needs: [version, release, upload-testflight]
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout (post-release commit — includes release_notes.txt)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Submit for App Review
        env:
          APP_STORE_CONNECT_API_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:    ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MARKETING_VERSION:                    ${{ needs.version.outputs.version }}
          BUILD_NUMBER:                         ${{ github.run_number }}
        run: bundle exec fastlane submit
