# Actions are pinned; the SLSA generator version-tag exception is policy-checked.
---
name: Release Prep
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      mode:
        description: Distribution also requires RELEASE_DISTRIBUTION_ENABLED=true
        type: choice
        options:
        - verify-only
        - release
        default: verify-only
        required: true
concurrency:
  group: release-prep-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    name: Determine candidate without write credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        cache: npm
    - name: Install locked tools
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Analyze Conventional Commits
      run: node scripts/semantic_dry_run.mjs build/version/semantic-release.json
    - name: Record candidate identity
      run: |-
        python3 - <<'PYCODE'
        import json, os
        from pathlib import Path
        r=json.loads(Path('build/version/semantic-release.json').read_text())
        assert r['source_sha'] == os.environ['GITHUB_SHA']
        number=int(os.environ['GITHUB_RUN_NUMBER']); attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
        assert 0 < number <= 9999 and 0 < attempt <= 99, 'Apple build number range exhausted'
        candidate=r['will_release'] or os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
        publish=r['will_release'] and os.environ['DISTRIBUTION']=='true' and (os.environ['GITHUB_EVENT_NAME']=='push' or os.environ['MODE']=='release')
        values=dict(version=r['version'],source_sha=r['source_sha'],build_number=f'{number}.{attempt}',run_id=os.environ['GITHUB_RUN_ID'],run_attempt=attempt,prefix=f"{os.environ['GITHUB_RUN_ID']}-{attempt}",candidate=str(candidate).lower(),publish=str(publish).lower())
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
         for key,value in values.items(): f.write(f'{key}={value}\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
         f.write(f"Candidate {r['version']} ({number}.{attempt}); source `{r['source_sha']}`; distribution enabled: {publish}.\n")
        PYCODE
      id: context
      env:
        DISTRIBUTION: "${{ vars.RELEASE_DISTRIBUTION_ENABLED }}"
        MODE: "${{ inputs.mode }}"
    - name: Upload version-${{ steps.context.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: version-${{ steps.context.outputs.prefix }}
        path: build/version/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
    if: github.ref == 'refs/heads/main'
    outputs:
      version: "${{ steps.context.outputs.version }}"
      source_sha: "${{ steps.context.outputs.source_sha }}"
      build_number: "${{ steps.context.outputs.build_number }}"
      run_id: "${{ steps.context.outputs.run_id }}"
      run_attempt: "${{ steps.context.outputs.run_attempt }}"
      prefix: "${{ steps.context.outputs.prefix }}"
      candidate: "${{ steps.context.outputs.candidate }}"
      publish: "${{ steps.context.outputs.publish }}"
  qa:
    name: Release QA
    needs: version
    if: needs.version.outputs.candidate == 'true'
    uses: "./.github/workflows/qa.yml"
    with:
      source: "${{ needs.version.outputs.source_sha }}"
      prefix: "${{ needs.version.outputs.prefix }}"
  package:
    name: Package source and App Store assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: version
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
        lfs: true
    - name: Download version-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: version-${{ needs.version.outputs.prefix }}
        path: build/version
    - name: Package and validate release inputs
      run: bash scripts/ci/package_release.sh
      env:
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Upload package-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: package-${{ needs.version.outputs.prefix }}
        path: build/package/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
    if: needs.version.outputs.candidate == 'true'
  build:
    name: Build and sign IPA
    runs-on: xcode-27
    timeout-minutes: 30
    needs: version
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Validate exact toolchain
      run: python3 scripts/ci/toolchain.py
    - name: Set up Ruby
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f
      with:
        bundler-cache: false
    - name: Install locked gems
      run: |-
        bundle config set --local path vendor/bundle
        bundle config set --local frozen true
        bundle install --jobs 4 --retry 3
    - name: Load read-only certificate repository key
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
      with:
        ssh-private-key: "${{ secrets.MATCH_SSH_PRIVATE_KEY }}"
    - name: Snapshot signing repository
      run: bash scripts/ci/signing_snapshot.sh
    - name: Import signing material
      run: bundle exec fastlane certificates
      env:
        MATCH_PASSWORD: "${{ secrets.MATCH_PASSWORD }}"
    - name: Remove SSH identities before compilation
      run: ssh-add -D
    - name: Archive and export signed IPA
      run: bundle exec fastlane build
      env:
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
        MARKETING_VERSION: "${{ needs.version.outputs.version }}"
    - name: Validate exported bundles and symbols
      run: |-
        mkdir -p build/release
        python3 scripts/ci/validate_ipa.py
        cp build/PicStrip.ipa build/build-env.json build/release/
        python3 scripts/ci/evidence.py checksums build/release --output build/release/build-checksums.json
      env:
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Upload build-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-${{ needs.version.outputs.prefix }}
        path: build/release/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
    - name: Package archive diagnostics
      run: |-
        mkdir -p build/archive-diagnostics
        if [ -d build/PicStrip.xcarchive ]; then tar -czf build/archive-diagnostics/PicStrip.xcarchive.tar.gz -C build PicStrip.xcarchive; fi
        if [ -d build/logs ]; then cp -R build/logs build/archive-diagnostics/; fi
      if: always()
    - name: Upload archive-diagnostics-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: archive-diagnostics-${{ needs.version.outputs.prefix }}
        path: build/archive-diagnostics/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
      if: always()
    - name: Delete temporary signing material
      run: bash scripts/ci/cleanup_signing.sh
      if: always()
    environment: signing
    if: needs.version.outputs.candidate == 'true'
  sbom:
    name: Generate source and runtime SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - version
    - build
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Install verified Syft
      run: bash scripts/ci/install_syft.sh
    - name: Download build-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: build-${{ needs.version.outputs.prefix }}
        path: build/ipa
    - name: Inventory source and shipped components
      run: |-
        mkdir -p build/sbom build/ipa-root
        syft dir:. --exclude './.git' --exclude './build' --exclude './node_modules' --exclude './vendor' -o spdx-json=build/sbom/source.spdx.json
        unzip -q build/ipa/PicStrip.ipa -d build/ipa-root
        syft dir:build/ipa-root -o spdx-json=build/ipa-syft.spdx.json
        python3 scripts/ci/runtime_sbom.py build/ipa/ipa-inventory.json build/ipa-syft.spdx.json build/sbom/ipa.spdx.json
        python3 scripts/ci/evidence.py checksums build/sbom --output build/sbom/sbom-checksums.json
    - name: Upload sbom-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sbom-${{ needs.version.outputs.prefix }}
        path: build/sbom/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
  evidence:
    name: Validate and attest build evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - version
    - qa
    - build
    - package
    - sbom
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Download build-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: build-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Download package-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: package-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Download qa-evidence-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: qa-evidence-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Download sbom-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: sbom-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Validate all evidence and bind exact assets
      run: python3 scripts/ci/evidence.py build release-assets
      env:
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Attest IPA and build manifest
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
      with:
        subject-path: |-
          release-assets/PicStrip.ipa
          release-assets/release-build-manifest.json
      id: attestation
    - name: Preserve signed bundle
      run: cp "$BUNDLE" release-assets/build-attestation.jsonl
      env:
        BUNDLE: "${{ steps.attestation.outputs.bundle-path }}"
    - name: Attest runtime SBOM
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
      with:
        subject-path: release-assets/PicStrip.ipa
        sbom-path: release-assets/ipa.spdx.json
      id: sbom
    - name: Preserve SBOM bundle
      run: cp "$BUNDLE" release-assets/sbom-attestation.jsonl
      env:
        BUNDLE: "${{ steps.sbom.outputs.bundle-path }}"
    - name: Compute isolated generator subjects
      run: |-
        cd release-assets
        shasum -a 256 PicStrip.ipa release-build-manifest.json release-source.tar.zst > slsa-subjects.txt
        echo "subjects=$(base64 -w0 slsa-subjects.txt)" >> "$GITHUB_OUTPUT"
      id: subjects
    - name: Upload evidence-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: evidence-${{ needs.version.outputs.prefix }}
        path: release-assets/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      subjects: "${{ steps.subjects.outputs.subjects }}"
  provenance:
    name: Isolated SLSA Build L3 provenance
    needs:
    - version
    - evidence
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.evidence.outputs.subjects }}"
      upload-assets: false
      provenance-name: provenance.intoto.jsonl
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - version
    - provenance
    - evidence
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Download evidence-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: evidence-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Download ${{ needs.provenance.outputs.provenance-name }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: "${{ needs.provenance.outputs.provenance-name }}"
        path: release-assets
    - name: Install SLSA verifier
      uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - name: Verify isolated provenance and every release asset
      run: python3 scripts/ci/verify_release.py release-assets --source "$SOURCE_SHA"
      env:
        GH_TOKEN: "${{ github.token }}"
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Summarize verified candidate
      run: echo "Verified source $SOURCE_SHA; candidate $VERSION ($BUILD_NUMBER).
        All QA, bundle and provenance checks passed." >> "$GITHUB_STEP_SUMMARY"
      env:
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Upload verified-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: verified-${{ needs.version.outputs.prefix }}
        path: release-assets/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
    permissions:
      contents: read
      attestations: read
  upload:
    name: Upload exact verified IPA
    runs-on: xcode-27
    timeout-minutes: 30
    needs:
    - version
    - verify
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Download verified-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: verified-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Install SLSA verifier
      uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - name: Reverify before upload
      run: python3 scripts/ci/verify_release.py release-assets --source "$SOURCE_SHA"
      env:
        GH_TOKEN: "${{ github.token }}"
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Set up Ruby
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f
      with:
        bundler-cache: false
    - name: Install locked gems
      run: |-
        bundle config set --local path vendor/bundle
        bundle config set --local frozen true
        bundle install --jobs 4 --retry 3
    - name: Upload without waiting on macOS
      run: bundle exec fastlane upload_testflight
      env:
        APP_STORE_CONNECT_API_KEY_ID: "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID
          }}"
        APP_STORE_CONNECT_API_KEY_CONTENT: "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT
          }}"
        IPA_PATH: release-assets/PicStrip.ipa
        RELEASE_MANIFEST: release-assets/release-build-manifest.json
    environment: testflight
    permissions:
      contents: read
      attestations: read
    if: needs.version.outputs.publish == 'true'
    concurrency:
      group: picstrip-app-store-mutations
      cancel-in-progress: false
  processing:
    name: Wait for Apple processing on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    needs:
    - version
    - upload
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Download verified-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: verified-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Set up Ruby
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f
      with:
        bundler-cache: false
    - name: Install locked gems
      run: |-
        bundle config set --local path vendor/bundle
        bundle config set --local frozen true
        bundle install --jobs 4 --retry 3
    - name: Wait for the exact processed build
      run: bundle exec fastlane wait_processing
      env:
        APP_STORE_CONNECT_API_KEY_ID: "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
        APP_STORE_CONNECT_API_KEY_ISSUER_ID: "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID
          }}"
        APP_STORE_CONNECT_API_KEY_CONTENT: "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT
          }}"
        RELEASE_MANIFEST: release-assets/release-build-manifest.json
        PROCESSING_RECEIPT: testflight-status.json
    - name: Upload processed-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: processed-${{ needs.version.outputs.prefix }}
        path: testflight-status.json
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
    environment: testflight
  finalize:
    name: Sign the processed release handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - version
    - processing
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Download verified-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: verified-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Download processed-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: processed-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Install SLSA verifier
      uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - name: Reverify and finalize manifest
      run: |-
        python3 scripts/ci/verify_release.py release-assets --source "$SOURCE_SHA"
        python3 scripts/ci/evidence.py finalize release-assets
      env:
        GH_TOKEN: "${{ github.token }}"
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Sign final release manifest
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
      with:
        subject-path: release-assets/release-manifest.json
        predicate-type: https://northcutted.github.io/picstrip/attestations/release/v2
        predicate-path: release-assets/release-manifest.json
      id: final
    - name: Preserve final signature
      run: cp "$BUNDLE" release-assets/release-attestation.jsonl
      env:
        BUNDLE: "${{ steps.final.outputs.bundle-path }}"
    - name: Upload final-${{ needs.version.outputs.prefix }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: final-${{ needs.version.outputs.prefix }}
        path: release-assets/
        retention-days: 90
        compression-level: 0
        if-no-files-found: error
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
  publish:
    name: Publish complete immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - version
    - finalize
    steps:
    - name: Checkout exact source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: "${{ needs.version.outputs.source_sha }}"
    - name: Download final-${{ needs.version.outputs.prefix }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: final-${{ needs.version.outputs.prefix }}
        path: release-assets
    - name: Install SLSA verifier
      uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
    - name: Verify final handoff
      run: python3 scripts/ci/verify_release.py release-assets --source "$SOURCE_SHA"
        --final
      env:
        GH_TOKEN: "${{ github.token }}"
        SOURCE_SHA: "${{ needs.version.outputs.source_sha }}"
        VERSION: "${{ needs.version.outputs.version }}"
        BUILD_NUMBER: "${{ needs.version.outputs.build_number }}"
        RELEASE_RUN_ID: "${{ needs.version.outputs.run_id }}"
        RELEASE_RUN_ATTEMPT: "${{ needs.version.outputs.run_attempt }}"
    - name: Mint repository-scoped release token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: "${{ secrets.RELEASE_APP_ID }}"
        private-key: "${{ secrets.RELEASE_APP_PRIVATE_KEY }}"
        permission-contents: write
        repositories: picstrip
      id: token
    - name: Attach all assets to a draft, verify, then publish
      run: python3 scripts/ci/publish_release.py
      env:
        GH_TOKEN: "${{ steps.token.outputs.token }}"
    environment: release-publishing
    permissions:
      contents: read
      attestations: read
