name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. Semantic Release dry run — determine next version ──────────────────
  version:
    name: Determine Next Version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # @semantic-release/github v10 checks write access in verifyConditions even on dry-run
    outputs:
      will_release: ${{ steps.semrel.outputs.will_release }}
      version:      ${{ steps.semrel.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install semantic-release
        run: npm ci

      - name: Dry-run semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "next release version"; then
            VERSION=$(echo "$OUTPUT" | grep -oP 'next release version is \K[^\s]+')
            echo "will_release=true"  >> "$GITHUB_OUTPUT"
            echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          else
            echo "will_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Validate the exact release SHA ───────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-26
    needs: version
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run SwiftLint
        run: bundle exec fastlane lint

  analyze:
    name: Static Analysis
    runs-on: macos-26
    needs: version
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('PicStrip.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Run xcodebuild analyze
        run: bundle exec fastlane analyze

  test:
    name: Unit Tests
    runs-on: macos-26
    needs: version
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('PicStrip.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Run Tests
        run: bundle exec fastlane test

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-test-results
          path: build/test_output/
          retention-days: 7

  # ── 3. Build + Sign + Upload to TestFlight ─────────────────────────────────
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    needs: [version, lint, analyze, test]
    if: needs.version.outputs.will_release == 'true'
    outputs:
      ipa-hashes: ${{ steps.digest.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SPM dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('PicStrip.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Match SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Run Fastlane beta
        env:
          MATCH_PASSWORD:                       ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:    ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          BUILD_NUMBER:                         ${{ github.run_number }}
          MARKETING_VERSION:                    ${{ needs.version.outputs.version }}
        run: bundle exec fastlane beta

      - name: Compute SHA-256 of IPA
        id: digest
        run: |
          HASHES=$(shasum -a 256 build/PicStrip.ipa | awk '{print $1 "  PicStrip.ipa"}' | base64 | tr -d '\n')
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          shasum -a 256 build/PicStrip.ipa | awk '{print $1 "  PicStrip.ipa"}' > build/PicStrip.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PicStrip-${{ needs.version.outputs.version }}
          path: |
            build/PicStrip.ipa
            build/PicStrip.ipa.sha256
          retention-days: 90

  # ── 3. Publish GitHub Release + tag ───────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install semantic-release
        run: npm ci

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # ── 5. SLSA L3 Provenance ─────────────────────────────────────────────────
  provenance:
    name: SLSA Provenance
    needs: [version, build, release]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      actions:  read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects:   "${{ needs.build.outputs.ipa-hashes }}"
      compile-generator: true
      upload-assets:     true
      upload-tag-name:   "v${{ needs.version.outputs.version }}"

  # ── 6. Attach artifacts to GitHub Release ─────────────────────────────────
  attach-release-assets:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    needs: [version, build, release, provenance]
    if: needs.version.outputs.will_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PicStrip-${{ needs.version.outputs.version }}
          path: artifacts/

      - name: Attach IPA + digest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" \
            artifacts/PicStrip.ipa \
            artifacts/PicStrip.ipa.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  # ── 7. Submit for App Review ───────────────────────────────────────────────
  # Requires manual approval via the "production" GitHub environment.
  # To enable: Settings → Environments → production → add required reviewers.
  #
  # Checks out main at HEAD (after semantic-release committed release_notes.txt
  # back) so the metadata directory includes the freshly generated What's New.
  # The binary is already in TestFlight; skip_binary_upload avoids a duplicate-
  # binary error and just submits the processed build for review.
  submit:
    name: Submit for App Review
    runs-on: ubuntu-latest
    environment: production
    needs: [version, build, release, provenance, attach-release-assets]
    if: needs.version.outputs.will_release == 'true'
    steps:
      - name: Checkout (post-release HEAD — includes release_notes.txt)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Submit for App Review
        env:
          APP_STORE_CONNECT_API_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:    ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MARKETING_VERSION:                    ${{ needs.version.outputs.version }}
          BUILD_NUMBER:                         ${{ github.run_number }}
        run: bundle exec fastlane submit
