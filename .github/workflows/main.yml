name: Release Prep
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-prep-main
  cancel-in-progress: false
jobs:
  prepare:
    uses: northcutted/ios-release-workflows/.github/workflows/prepare.yml@60ec43c4a00a8d942acaa07d469a26c0e89fc005
    with:
      config: .github/ios-release.json
      platform_revision: 60ec43c4a00a8d942acaa07d469a26c0e89fc005
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
