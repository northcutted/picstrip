name: Release Prep
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-prep-main
  cancel-in-progress: false
jobs:
  prepare:
    uses: northcutted/ios-release-workflows/.github/workflows/prepare.yml@3d02154e6f070560d08fdb993643ca5b5762153c
    with:
      config: .github/ios-release.json
      platform_revision: 3d02154e6f070560d08fdb993643ca5b5762153c
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
