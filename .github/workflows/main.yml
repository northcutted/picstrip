name: Release Prep
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-prep-main
  cancel-in-progress: false
jobs:
  prepare:
    uses: northcutted/ios-release-workflows/.github/workflows/prepare.yml@71d5b6bb095d70500213a75d6c7f2365468bcffe
    with:
      config: .github/ios-release.json
      platform_revision: 71d5b6bb095d70500213a75d6c7f2365468bcffe
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
