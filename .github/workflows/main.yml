name: Release Prep
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-prep-main
  cancel-in-progress: false
jobs:
  changes:
    name: Select release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prepare: ${{ steps.changes.outputs.prepare }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify release changes
        id: changes
        run: python3 scripts/ci/changes.py
  prepare:
    needs: changes
    if: needs.changes.outputs.prepare == 'true'
    uses: northcutted/ios-release-workflows/.github/workflows/prepare.yml@a3263909aaf9b71e9b4c5b92fbb5ef1728644b65
    with:
      config: .github/ios-release.json
      platform_revision: a3263909aaf9b71e9b4c5b92fbb5ef1728644b65
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
