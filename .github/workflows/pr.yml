name: PR Checks
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      test_workers:
        type: choice
        options:
          - "1"
          - "2"
        default: "1"
        description: Benchmark only; production remains serial until five-run acceptance
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      qa: ${{ steps.changes.outputs.qa }}
      screenshots: ${{ steps.changes.outputs.screenshots }}
      store: ${{ steps.changes.outputs.store }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changes conservatively
        id: changes
        run: node scripts/ci/changes.mjs
  policy:
    needs: changes
    name: Workflow policy and release regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: ${{ needs.changes.outputs.store == 'true' }}
      - name: Load pinned platform validation tools
        uses: northcutted/ios-release-workflows/actions/bootstrap@2619b51c89cb847b273a4389c3226d5039dc627f
        with:
          config: .github/ios-release.json
          revision: 2619b51c89cb847b273a4389c3226d5039dc627f
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned workflow validator
        run: python3 "$IOS_RELEASE_ROOT/bin/ios-release" install-actionlint
      - name: Validate workflows and release guardrails
        run: |-
          python3 scripts/validate_store_metadata.py
          npm run check:workflows
          npm run check:docs
          npm run test:ci
          actionlint
      - name: Validate changed store asset inventory
        if: needs.changes.outputs.store == 'true'
        run: python3 "$IOS_RELEASE_ROOT/bin/ios-release" screenshots-verify fastlane/screenshots/processed --output "$RUNNER_TEMP/screenshots-manifest.json"
  qa:
    needs: changes
    if: needs.changes.outputs.qa == 'true'
    uses: northcutted/ios-release-workflows/.github/workflows/ci.yml@2619b51c89cb847b273a4389c3226d5039dc627f
    with:
      config: .github/ios-release.json
      platform_revision: 2619b51c89cb847b273a4389c3226d5039dc627f
      source: ${{ github.sha }}
      prefix: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      test_workers: ${{ inputs.test_workers || '1' }}
    permissions:
      contents: read
  screenshots:
    needs: changes
    name: UI and screenshot smoke test
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Load pinned screenshot toolchain validator
        uses: northcutted/ios-release-workflows/actions/bootstrap@2619b51c89cb847b273a4389c3226d5039dc627f
        with:
          config: .github/ios-release.json
          revision: 2619b51c89cb847b273a4389c3226d5039dc627f
      - name: Resolve screenshot simulators
        run: python3 "$IOS_RELEASE_ROOT/bin/ios-release" toolchain --screenshots
      - name: Install locked platform Ruby
        uses: northcutted/ios-release-workflows/actions/ruby@2619b51c89cb847b273a4389c3226d5039dc627f
      - name: Capture en-US screenshots
        run: python3 "$IOS_RELEASE_ROOT/bin/ios-release" screenshots-capture --languages en-US
      - name: Upload pr-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: fastlane/screenshots/en-US/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
        if: always()
      # This secret-free job uses fresh hosted simulators and repository-owned
      # synthetic fixtures only. Preserve the failing device's XCTest evidence.
      - name: Retain screenshot failure diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screenshot-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fastlane/screenshot_logs/
            fastlane/screenshots/test_output/
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
        if: failure()
    if: needs.changes.outputs.screenshots == 'true'
  gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - changes
      - policy
      - qa
      - screenshots
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require selected checks and validate every skip
        run: node scripts/ci/changes.mjs gate
        env:
          JOBS: ${{ toJSON(needs) }}
          SELECTION: ${{ toJSON(needs.changes.outputs) }}
    if: always()
