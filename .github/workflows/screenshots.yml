name: Screenshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to capture screenshots from. Only main uploads to App Store Connect."
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  # ── 1. Capture screenshots on macOS (simulator required) ──────────────────
  capture:
    name: Capture Screenshots
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "2"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-screenshots-${{ hashFiles('PicStrip.xcodeproj/project.pbxproj', 'PicStrip.xcodeproj/xcshareddata/xcschemes/PicStripScreenshots.xcscheme', 'fastlane/Fastfile', 'fastlane/Snapfile') }}
          restore-keys: |
            ${{ runner.os }}-screenshots-

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Capture screenshots
        run: |
          sudo defaults write /Library/Preferences/com.apple.security.revocation OCSPStyle None
          bundle exec fastlane screenshots

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: fastlane/screenshots/
          retention-days: 30

      - name: Upload snapshot logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-logs
          path: fastlane/screenshot_logs/
          retention-days: 14
          if-no-files-found: ignore

  # ── 2. Upload to App Store Connect (Ubuntu — just an API call) ─────────────
  upload:
    name: Upload to App Store Connect
    runs-on: ubuntu-latest
    needs: capture
    if: ${{ inputs.ref == 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Download screenshots artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: fastlane/screenshots/

      - name: Remove non-locale screenshot folders
        run: rm -rf fastlane/screenshots/Logs

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:    ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane upload_screenshots
