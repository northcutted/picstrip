name: Capture Screenshots
on:
  workflow_dispatch:
    inputs:
      languages:
        type: string
        default: ""
        description: Comma-separated capture locales; blank means all locales
permissions:
  contents: read
concurrency:
  group: capture-screenshots
  cancel-in-progress: false
jobs:
  capture:
    name: Capture reviewed screenshot candidate
    runs-on: xcode-27
    timeout-minutes: 240
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: main
          lfs: true
      - name: Load pinned screenshot validation and publishing tools
        uses: northcutted/ios-release-workflows/actions/bootstrap@b3ae65935bc285871b8f4a426d5ec577a080cf91
        with:
          config: .github/ios-release.json
          revision: b3ae65935bc285871b8f4a426d5ec577a080cf91
      - name: Record capture source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve exact screenshot toolchain
        run: ios-release toolchain --screenshots
      - name: Install locked platform Ruby
        uses: northcutted/ios-release-workflows/actions/ruby@b3ae65935bc285871b8f4a426d5ec577a080cf91
      - name: Install locked image tools
        run: ios-release setup --images
      - name: Capture selected locales
        run: ios-release screenshots-capture --languages "$LANGUAGES"
        env:
          LANGUAGES: ${{ inputs.languages }}
      - name: Compose and validate complete release coverage
        run: >-
          ios-release screenshots-compose

          ios-release screenshots-verify fastlane/screenshots/processed --output
          build/screenshots-manifest.json
      - name: Upload screenshots-${{ github.run_id }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screenshots-${{ github.run_id }}
          path: fastlane/screenshots/processed/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Upload screenshot-logs-${{ github.run_id }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screenshot-logs-${{ github.run_id }}
          path: |
            fastlane/screenshot_logs/
            fastlane/screenshots/test_output/
            build/build-env.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
        if: failure()
    if: github.ref == 'refs/heads/main'
  pull-request:
    name: Open screenshot pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: capture
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.capture.outputs.source }}
          lfs: true
      - name: Load pinned screenshot validation and publishing tools
        uses: northcutted/ios-release-workflows/actions/bootstrap@b3ae65935bc285871b8f4a426d5ec577a080cf91
        with:
          config: .github/ios-release.json
          revision: b3ae65935bc285871b8f4a426d5ec577a080cf91
      - name: Download screenshots-${{ github.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: screenshots-${{ github.run_id }}
          path: incoming
      - name: Validate candidate images
        run: ios-release screenshots-verify incoming --output build/screenshots-manifest.json
      - name: Mint screenshot PR token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: picstrip
        id: token
      - name: Open a PR without changing main
        run: ios-release screenshots-publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
    environment: screenshot-publishing
