name: Capture Screenshots

# Captures fresh App Store screenshots on the macOS runner, composes the
# marketing PNGs via the Python compositor, and commits the result back to
# the repo via Git LFS (with [skip ci]).
#
# Upload to App Store Connect does NOT happen here. Screenshots are uploaded
# inside the `submit` lane in main.yml, which runs at a pinned post-release
# SHA and checks out LFS so the processed PNGs are present on disk. This
# ensures every release's screenshots are versioned alongside the exact code
# that produced them and gated behind the same App Review submission approval.

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Locale subset for the capture, comma-separated. Empty = all locales in Snapfile."
        type: string
        required: false
        default: ""

permissions:
  contents: write   # needed to commit refreshed processed/ PNGs back to repo

jobs:
  capture:
    name: Capture and Commit Screenshots
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Boot simulators
        run: |
          xcrun simctl boot "iPhone 17 Pro Max"     || true
          xcrun simctl boot "iPad Pro 13-inch (M5)" || true
          xcrun simctl bootstatus "iPhone 17 Pro Max"     -b
          xcrun simctl bootstatus "iPad Pro 13-inch (M5)" -b

      - name: Override status bars
        run: |
          for device in "iPhone 17 Pro Max" "iPad Pro 13-inch (M5)"; do
            xcrun simctl status_bar "$device" override \
              --time "9:41" \
              --dataNetwork wifi \
              --wifiMode active \
              --wifiBars 3 \
              --cellularMode active \
              --cellularBars 4 \
              --batteryState charged \
              --batteryLevel 100
          done

      - name: Install Python compositor deps
        run: pip3 install --user -r scripts/requirements.txt

      - name: Capture screenshots
        run: |
          sudo defaults write /Library/Preferences/com.apple.security.revocation OCSPStyle None
          if [ -n "${{ inputs.languages }}" ]; then
            bundle exec fastlane screenshots languages:"${{ inputs.languages }}"
          else
            bundle exec fastlane screenshots
          fi

      - name: Compose marketing screenshots
        run: bundle exec fastlane process_screenshots

      - name: Commit refreshed screenshots to LFS
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/screenshots/processed/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore(screenshots): refresh App Store screenshots [skip ci]"
            git push
          fi
